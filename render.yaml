# Render Blueprint for HireLink Deployment
# This file automates the creation of both the Web Service and the Database.

services:
  - type: web
    name: hirelink-app
    env: docker
    plan: starter # Chromium needs more memory than the free tier
    region: ohio
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8501
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render Dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hirelink-db
          property: connectionString

databases:
  - name: hirelink-db
    plan: free # Free tier or starter for DB
    region: ohio
